# DevPrep — cấu hình nginx phục vụ site tĩnh.
# Nạp vào /etc/nginx/conf.d/default.conf, thay tệp mặc định của image nginx.
#
# Cổng 80 để giữ nguyên ánh xạ "9020:80" trong docker-compose.yml.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Đứng sau reverse proxy thì redirect tuyệt đối sẽ lộ cổng nội bộ ra ngoài.
    absolute_redirect off;

    # Nội dung là tiếng Việt: gắn charset vào Content-Type để mở thẳng tệp .md
    # trong tab trình duyệt cũng đọc được. (fetch() luôn giải mã UTF-8 sẵn nên
    # app không phụ thuộc điều này, nhưng header đúng vẫn hơn.)
    charset       utf-8;
    charset_types text/css text/plain text/markdown text/xml
                  application/javascript application/json
                  application/manifest+json image/svg+xml;

    # content/ hiện ~108MB markdown — gzip là khoản lợi lớn nhất của tệp này.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types      text/plain text/css text/markdown text/xml
                    application/javascript application/json
                    application/manifest+json image/svg+xml;

    # Tệp tĩnh không có hash trong tên nên cache mạnh sẽ khiến người dùng dính
    # bản JS cũ sau khi deploy. "no-cache" vẫn cho lưu đĩa nhưng luôn revalidate
    # bằng ETag — phần lớn request trả 304, gần như miễn phí.
    add_header Cache-Control "no-cache" always;

    # nginx không có sẵn MIME cho .md (mặc định trả application/octet-stream).
    # Dùng default_type chứ KHÔNG dùng khối types{}: khối types{} lồng trong
    # server sẽ thay thế TOÀN BỘ bảng mime.types kế thừa, làm hỏng .js/.css/.png.
    location ~ \.md$ {
        default_type text/markdown;
    }

    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Giữ trang lỗi 50x mà repo đã có sẵn.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    # Router của app chạy bằng hash (#/docs/...) nên KHÔNG cần rewrite kiểu SPA.
    # Giữ 404 thật: docs.js dựa vào res.ok để hiện thông báo "chưa tải được".
}

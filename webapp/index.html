<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevPrep — Học · Ôn tập · Luyện thi</title>
  <meta name="description" content="Nền tảng học đa lĩnh vực: Kubernetes & chứng chỉ (CKAD, CKA, CKS), Lập trình hệ thống (UIUC CS 241), Java & Spring Boot Scalability, Modern Java in Action, Designing Data-Intensive Applications, Kafka: The Definitive Guide, Modern Concurrency in Java, Spring Start Here, Spring Security và lộ trình Senior Java 24 tháng. Tài liệu, lộ trình, ma trận năng lực, flashcards, trắc nghiệm, thi thử và labs thực hành." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Đặt theme trước khi render để tránh chớp màu (FOUC).
    (function () {
      try {
        // store.js lưu giá trị dạng JSON nên cần bỏ dấu nháy kép.
        var t = (localStorage.getItem("kubeprep.theme") || "").replace(/"/g, "");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) { /* private mode */ }
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" aria-label="Mở menu">☰</button>
      <a class="topbar-brand" href="#/">📚 DevPrep</a>
      <button class="icon-btn" id="theme-btn-mobile" aria-label="Đổi giao diện sáng/tối">◐</button>
    </header>

    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-logo">📚</span>
        <span class="brand-text">
          <strong>DevPrep</strong>
          <small>Học · Ôn tập · Luyện thi</small>
        </span>
      </a>

      <div class="field-switch" id="field-switch"></div>
      <nav class="nav" id="nav"></nav>

      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-sm" id="theme-btn">◐ Sáng / Tối</button>
        <a class="muted-link" id="ref-link" href="#" target="_blank" rel="noopener" hidden></a>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main" id="main" tabindex="-1">
      <noscript>Ứng dụng cần JavaScript để hoạt động.</noscript>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

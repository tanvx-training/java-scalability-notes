# Deploy KubePrep (webapp/) lên GitHub Pages.
# Kích hoạt: Settings → Pages → Source: "GitHub Actions" (chỉ cần làm 1 lần).

name: Deploy KubePrep to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (copy webapp + markdown content)
        run: |
          mkdir -p _site
          cp -r webapp/. _site/
          rm -f _site/dev.sh _site/build-content.sh _site/check-data.mjs _site/package.json
          webapp/build-content.sh _site/content

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

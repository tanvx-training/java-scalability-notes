spring:
  application:
    name: gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
app:
  version: ${APP_VERSION:1.0}
  greeting: ${APP_GREETING:Xin chào từ shop}
  catalog-url: ${CATALOG_URL:http://catalog:8080}
  order-url: ${ORDER_URL:http://order:8080}

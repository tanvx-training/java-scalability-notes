# Patch strategic merge: chỉ ghi trường cần đổi; container khớp theo name.
# Đo (catalog H2, MaxRAMPercentage=50): 176Mi trở xuống luôn OOMKilled, 192Mi OOMKilled 1/2 lần (memory.peak 188Mi lần qua),
# 208Mi qua 3/3 (memory.peak 171–195Mi). Lab dùng 224Mi để có khoảng dư khi JVM khởi động trong cửa sổ tải cao sau boot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  template:
    spec:
      containers:
      - name: catalog
        resources:
          requests:
            memory: 224Mi
          limits:
            memory: 224Mi

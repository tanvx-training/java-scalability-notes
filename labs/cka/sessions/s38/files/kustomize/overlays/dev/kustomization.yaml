apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-dev
resources:
- ../../base
replicas:
- name: catalog
  count: 1
images:
- name: shop/catalog
  newTag: "1.0"
patches:
- path: memory.yaml
configMapGenerator:
- name: catalog-config
  behavior: merge
  literals:
  - LOGGING_LEVEL_SHOP=DEBUG

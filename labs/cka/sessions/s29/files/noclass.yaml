apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-noclass
  namespace: shop
spec:
  rules:
  - host: noclass.shop.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080

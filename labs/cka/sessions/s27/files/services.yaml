apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: shop
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: shop
  labels:
    app: catalog
spec:
  type: ClusterIP
  selector:
    app: catalog
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: shop
  labels:
    app: order
spec:
  type: ClusterIP
  selector:
    app: order
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP

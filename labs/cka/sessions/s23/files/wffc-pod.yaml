apiVersion: v1
kind: Pod
metadata:
  name: wffc-pod
  namespace: shop
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sh", "-c", "echo hello > /data/hello.txt; sleep 3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: wffc-lab

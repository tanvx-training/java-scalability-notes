apiVersion: v1
kind: Pod
metadata:
  name: pvc-probe
  namespace: shop
spec:
  nodeName: cka-w2
  containers:
  - name: probe
    image: busybox:1.37
    command: ["sleep", "3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: shop-data

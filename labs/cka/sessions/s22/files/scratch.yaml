apiVersion: v1
kind: Pod
metadata:
  name: scratch
  namespace: shop
spec:
  containers:
  - name: writer
    image: busybox:1.37
    command: ["sh", "-c", "while true; do date >> /cache/log.txt; sleep 5; done"]
    volumeMounts:
    - name: cache
      mountPath: /cache
  - name: reader
    image: busybox:1.37
    command: ["sh", "-c", "until [ -f /cache/log.txt ]; do sleep 1; done; tail -f /cache/log.txt"]
    volumeMounts:
    - name: cache
      mountPath: /cache
      readOnly: true
  volumes:
  - name: cache
    emptyDir:
      sizeLimit: 16Mi

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: shop
spec:
  parentRefs:
  - name: shop-gw
  hostnames:
  - shop.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: gateway
      port: 8080
      weight: 90
    - name: gateway-v1
      port: 8080
      weight: 10

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gateway-v1
  name: gateway-v1
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-v1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway-v1
    spec:
      priorityClassName: shop-critical
      terminationGracePeriodSeconds: 45
      initContainers:
      - name: wait-catalog
        image: busybox:1.37
        command:
        - sh
        - -c
        - until wget -q -T 2 -O /dev/null http://catalog:8080/actuator/health/readiness; do echo chờ catalog; sleep 2; done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
      containers:
      - image: shop/gateway:1.0
        name: gateway
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: -XX:MaxRAMPercentage=50
        envFrom:
        - configMapRef:
            name: shop-config
        volumeMounts:
        - name: app-config
          mountPath: /config
          readOnly: true
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '10'
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 384Mi
      volumes:
      - name: app-config
        configMap:
          name: gateway-files
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gateway-v1
  name: gateway-v1
  namespace: shop
spec:
  type: ClusterIP
  selector:
    app: gateway-v1
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP

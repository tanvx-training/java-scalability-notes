apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-draft
  namespace: shop
spec:
  parentRefs:
  - name: shop-gw
  hostnames:
  - shop.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v2
    backendRefs:
    - name: gateway-v2
      port: 8080

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: shop
  labels:
    app: log-agent
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      terminationGracePeriodSeconds: 5
      containers:
      - name: agent
        image: busybox:1.37
        command:
        - sh
        - -c
        - while true; do echo "$(date -Iseconds) $NODE_NAME $(ls /var/log/pods | wc -l) thư mục log Pod"; sleep 60; done
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
          type: Directory

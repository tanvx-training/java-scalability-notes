apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: shop
spec:
  completions: 3
  parallelism: 1
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: seed
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          wget -qO- --header 'Content-Type: application/json' --post-data '{"productId":1,"qty":2}' http://gateway:8080/api/orders

# Giá trị mặc định của chart shop. Mỗi service: image (repository, tag), replicas, resources.
# Ghi đè khi cài: --set order.image.tag=2.0, hay -f values-<môi trường>.yaml.
# 0.2.0 (s41): order 2 replica; gateway, catalog, order trải đều trên các worker (spread), có PDB (pdb.minAvailable); catalog, order cùng PriorityClass với gateway.

# topologySpreadConstraints cho gateway, catalog, order: lệch tối đa 1 Pod giữa các node (kubernetes.io/hostname), không
# tính node có taint mà Pod không chịu (control plane, node đang cordon), đếm riêng từng ReplicaSet (pod-template-hash).
spread:
  enabled: true
  maxSkew: 1

# PriorityClass của catalog và order (gateway, gateway-v1 đã dùng shop-critical từ s19). Lúc drain, Pod thay của gateway
# (shop-critical) chiếm chỗ trên worker còn lại bằng cách preempt Pod ưu tiên thấp hơn: catalog, order (và postgres-0) cùng
# mức thì không bị đá.
priorityClassName: shop-critical

javaOpts: -XX:MaxRAMPercentage=50

db:
  url: jdbc:postgresql://postgres-0.postgres.shop.svc.cluster.local:5432/shop
  secret: db-cred          # Secret nằm ngoài chart (tạo ở s12/s24)

# ConfigMap shop-config: envFrom của gateway và gateway-v1
config:
  APP_GREETING: Xin chào từ ConfigMap
  CATALOG_URL: http://catalog:8080
  ORDER_URL: http://order:8080

gateway:
  image:
    repository: shop/gateway
    tag: "2.0"
  replicas: 2
  pdb:
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 384Mi

gatewayV1:
  image:
    repository: shop/gateway
    tag: "1.0"
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 384Mi

catalog:
  image:
    repository: shop/catalog
    tag: "1.0"
  replicas: 2              # chỉ dùng khi autoscaling.enabled=false
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  pdb:
    minAvailable: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 384Mi

order:
  image:
    repository: shop/order
    tag: "2.0"
  replicas: 2
  pdb:
    minAvailable: 1
  serviceAccount: order
  config:                  # ConfigMap order-config (envFrom của order)
    CATALOG_URL: http://catalog:8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 384Mi
